name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # The public repo ships no data packs (copyrighted textbook material — see
      # docs/JUDGE_REPRODUCIBILITY.md). Seed them offline so the eval gate has a
      # corpus. Deterministic (bag-of-words stub) embeddings: this is a
      # reproducibility / smoke check over the hand-authored public-fallback
      # subjects, NOT the production bge-m3 benchmark in docs/EVALUATION.md.
      # chemistry / math / russian have no public corpus and are reported as
      # skipped; the gate still fails if any of romanian/english/biology/history
      # was not actually evaluated.
      - name: Seed packs (offline, deterministic — public-fallback subjects)
        run: EMBED_MODE=deterministic npm run seed

      - name: Eval gate (retrieval quality — partial public coverage)
        run: npm run eval:ci

      - name: Build
        run: npm run build
