<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Video inset — metrics</title>
<!--
  Video picture-in-picture inset for docs/INTEL_FESTIVAL_2026_READINESS.html §15.3.
  Sits at 1:38-1:46 of the final cut, ~1/4 of frame area, over the Technology beat.

  HOW TO USE WHEN THE REAL NUMBERS ARRIVE (26-27 Aug):
    1. Edit the DATA object in the <script> below - that is the ONLY place numbers live.
    2. Reload this file in a browser and check it still reads at small size
       (the .stage div below is already sized to the intended 960x540 export).
    3. Screenshot the #card element (not the whole page) at 960x540 and hand
       that PNG to the video editor as the PiP layer.
  Nothing else in this file needs to change for a normal metric swap.
-->
<style>
  :root {
    color-scheme: dark;
    --surface:     #14181f;
    --surface-2:   #1b212b;
    --text-primary:#ffffff;
    --text-muted:  #a7afc0;
    --series-1:    #3987e5; /* blue — dataviz skill categorical slot 1, dark step */
    --series-2:    #d95926; /* orange — dataviz skill categorical slot 2, dark step */
    --good:        #0ca30c;
    --ring:        rgba(255,255,255,0.10);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #0d0d0d;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* .stage frames the export at the exact PiP render size so what you see
     on screen is what the screenshot captures. */
  .stage {
    width: 960px;
    height: 540px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 24px auto;
  }
  #card {
    width: 100%;
    height: 100%;
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 20px;
    padding: 40px 48px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }
  .placeholder-flag {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    align-self: flex-start;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(217, 89, 38, 0.18);
    color: #f0a480;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .placeholder-flag::before { content: "●"; color: #d95926; font-size: 10px; }
  h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    line-height: 1.15;
    text-wrap: balance;
  }
  .caption {
    margin: 0;
    font-size: 18px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .bars { display: flex; flex-direction: column; gap: 18px; margin-top: 4px; }
  .bar-row { display: flex; flex-direction: column; gap: 6px; }
  .bar-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-size: 20px;
    color: var(--text-primary);
  }
  .bar-label .value { font-size: 26px; font-weight: 700; }
  .bar-track {
    height: 30px;
    background: var(--surface-2);
    border-radius: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 8px;
    display: flex;
    align-items: center;
    transition: width 0.2s ease;
  }
  .bar-fill.series-1 { background: var(--series-1); }
  .bar-fill.series-2 { background: var(--series-2); }
  .footnote {
    margin: 4px 0 0;
    font-size: 14px;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="stage">
    <div id="card"></div>
  </div>

  <script>
    // ------------------------------------------------------------------
    // THE ONLY PLACE NUMBERS LIVE. Replace placeholder:true and the
    // values/labels below once the real measurement lands (26-27 Aug),
    // per docs/INTEL_FESTIVAL_2026_READINESS.html §15.3.
    //
    // Default scenario here is the Intel OVMS latency benchmark
    // (cloud API vs local OVMS int8) — the P1 risk item in §13.
    // If instead the confirmed metric turns out to be the exact
    // June participant count (n/N), swap `bars` for a single-bar or
    // stat-tile shape — see the STAT-TILE ALTERNATE block commented
    // below.
    // ------------------------------------------------------------------
    const DATA = {
      placeholder: true, // set to false once real numbers are filled in
      title: "Local inference, measured",
      caption: "Per-request latency — placeholder values, not yet measured",
      unit: "ms / request",
      bars: [
        { label: "Cloud API", value: 000, series: "series-2" },
        { label: "Local OVMS (int8)", value: 000, series: "series-1" }
      ],
      footnote: "Intel OpenVINO Model Server, NNCF int8 — measured on demo hardware"
    };

    // --- STAT-TILE ALTERNATE (uncomment + comment out DATA above if the
    // confirmed number turns out to be the exact June n/N instead) ---
    // const DATA = {
    //   placeholder: true,
    //   title: "June field test",
    //   caption: "Students who used the practice mode",
    //   unit: "",
    //   bars: [{ label: "Confirmed users", value: 0, series: "series-1" }],
    //   footnote: "n/N by session log — placeholder, not yet confirmed"
    // };

    function render(data) {
      const card = document.getElementById('card');
      card.innerHTML = '';

      if (data.placeholder) {
        const flag = document.createElement('div');
        flag.className = 'placeholder-flag';
        flag.textContent = 'PLACEHOLDER — replace before export';
        card.appendChild(flag);
      }

      const h1 = document.createElement('h1');
      h1.textContent = data.title;
      card.appendChild(h1);

      const cap = document.createElement('p');
      cap.className = 'caption';
      cap.textContent = data.caption;
      card.appendChild(cap);

      const maxVal = Math.max(1, ...data.bars.map(b => b.value));
      const bars = document.createElement('div');
      bars.className = 'bars';
      data.bars.forEach(b => {
        const row = document.createElement('div');
        row.className = 'bar-row';

        const label = document.createElement('div');
        label.className = 'bar-label';
        const name = document.createElement('span');
        name.textContent = b.label;
        const val = document.createElement('span');
        val.className = 'value';
        val.textContent = data.unit ? `${b.value} ${data.unit}` : String(b.value);
        label.appendChild(name);
        label.appendChild(val);
        row.appendChild(label);

        const track = document.createElement('div');
        track.className = 'bar-track';
        const fill = document.createElement('div');
        fill.className = `bar-fill ${b.series}`;
        const pct = Math.max(4, Math.round((b.value / maxVal) * 100));
        fill.style.width = pct + '%';
        track.appendChild(fill);
        row.appendChild(track);

        bars.appendChild(row);
      });
      card.appendChild(bars);

      const foot = document.createElement('p');
      foot.className = 'footnote';
      foot.textContent = data.footnote;
      card.appendChild(foot);
    }

    render(DATA);
  </script>
</body>
</html>
